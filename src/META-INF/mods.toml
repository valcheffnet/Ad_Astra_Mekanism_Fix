[[mods]]
modId="ad_astra_mekanism_fix"
version="1.0.1"
displayName="Ad Astra Mekanism Fix"
authors="SasnycoN"
description='''
Ad Astra 1.15.x ships two Mekanism-conditional recipes whose input tags
are not defined anywhere:

  forge:sandstone/venus_sandstone   crushing:  venus_sandstone -> venus_sand
  forge:ores/ice_shard              enriching: ice_shard_ore -> ice_shards

Adds the two tags. Only matters when Ad Astra and Mekanism are both loaded.
'''

[[dependencies.ad_astra_mekanism_fix]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ad_astra_mekanism_fix]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.ad_astra_mekanism_fix]]
    modId="ad_astra"
    mandatory=true
    versionRange="[1.15,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ad_astra_mekanism_fix]]
    modId="mekanism"
    mandatory=true
    versionRange="[10.4,)"
    ordering="AFTER"
    side="BOTH"
